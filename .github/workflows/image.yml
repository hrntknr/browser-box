name: image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - compose.yml
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/hrntknr/browser-box:latest
            ghcr.io/hrntknr/browser-box:sha-${{ github.sha }}
