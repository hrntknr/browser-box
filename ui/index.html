<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<script>
  if (matchMedia("(pointer: coarse)").matches)
    document.documentElement.classList.add("touch-ui");
</script>
<title>browser-box</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230b0e14'/><circle cx='8' cy='8' r='4' fill='%2358a6ff'/></svg>">
<style>
  html, body {
    margin: 0; height: 100%; background: #0b0e14; overflow: hidden;
    overscroll-behavior: none;
    font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
  }
  /* height tracks the visible viewport (dvh), not the layout viewport */
  #screen { position: fixed; inset: 0; height: 100vh; height: 100dvh; }
  #screen canvas { touch-action: none; }
  /* noVNC resets any custom scale when its screen div changes size; hidden scrollbars keep the observed box constant */
  #screen > div { scrollbar-width: none; }
  #screen > div::-webkit-scrollbar { display: none; }

  #bar {
    position: fixed; z-index: 1; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    box-sizing: border-box; max-width: calc(100vw - 16px);
    background: rgba(22, 27, 34, .92); border: 1px solid #30363d; border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .4); backdrop-filter: blur(8px);
    transition: opacity .25s; opacity: 1;
  }
  #state {
    display: flex; align-items: center; gap: 7px; padding: 0 6px; flex: none;
    font-size: 13px; color: #c9d1d9; white-space: nowrap; user-select: none;
  }
  #dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #8b949e; }
  #bar[data-state="readonly"] #dot { background: #3fb950; }
  #bar[data-state="manual"] #dot { background: #d29922; }
  #bar[data-state="offline"] #dot { background: #f85149; }
  button {
    appearance: none; border: 0; border-radius: 999px; padding: 7px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer; touch-action: manipulation;
    background: rgba(255, 255, 255, .06); color: #c9d1d9;
    white-space: nowrap; flex: none;
  }
  button:not(:disabled):hover { background: rgba(255, 255, 255, .14); }
  button:disabled { opacity: .45; cursor: default; }
  #handover[data-mode="takeover"] { background: #d29922; color: #0b0e14; }
  #handover[data-mode="takeover"]:not(:disabled):hover { background: #e3b341; }
  #handover[data-mode="return"] { background: transparent; color: #c9d1d9; box-shadow: inset 0 0 0 1px #30363d; }

  @media (hover: hover) and (pointer: fine) {
    #bar.idle { opacity: .18; }
    #bar.idle:hover, #bar.idle:focus-within { opacity: 1; }
  }

  html.touch-ui #bar {
    top: auto; bottom: max(14px, env(safe-area-inset-bottom));
    flex-wrap: nowrap; gap: 4px; padding: 6px 8px;
  }
  html.touch-ui #state { padding: 0; }
  html.touch-ui #dot, html.touch-ui #label { display: none; }
  html.touch-ui button { min-height: 40px; min-width: 38px; padding: 6px 8px; font-size: 13px; }
  html.touch-ui #handover { padding: 6px 10px; }
  button svg { display: block; margin: 0 auto; }
  #bar.folded { display: none; }
  html:not(.touch-ui) #bar-fold svg { transform: rotate(180deg); }
  #bar-handle {
    position: fixed; z-index: 1; right: 10px; top: 10px; display: none;
    align-items: center; gap: 7px; padding: 8px 10px;
    background: rgba(22, 27, 34, .92); border: 1px solid #30363d;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .4); backdrop-filter: blur(8px);
  }
  #bar-handle.shown { display: flex; }
  html:not(.touch-ui) #bar-handle svg { transform: rotate(180deg); }
  html.touch-ui #bar-handle { top: auto; bottom: max(10px, env(safe-area-inset-bottom)); }
  #handle-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #8b949e; }
  #bar-handle[data-state="readonly"] #handle-dot { background: #3fb950; }
  #bar-handle[data-state="manual"] #handle-dot { background: #d29922; }
  #bar-handle[data-state="offline"] #handle-dot { background: #f85149; }
  #soft-keyboard[data-on="true"] { background: #1f6feb; color: #fff; }
  #pip[data-on="true"] { background: #1f6feb; color: #fff; }
  #pc-size[data-on="true"] { background: #1f6feb; color: #fff; }

  #kbd-input {
    position: fixed; top: 24px; left: 50%; width: 2px; height: 30px;
    margin: 0; padding: 0; border: 0; opacity: 0; font-size: 16px;
    background: transparent; color: transparent;
  }
</style>
</head>
<body>
<div id="screen"></div>
<input id="kbd-input" type="text" tabindex="-1"
  autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
<div id="bar" data-state="connecting">
  <span id="state"><span id="dot"></span><span id="label">接続中…</span></span>
  <button id="zoom-out" title="縮小" aria-label="縮小">−</button>
  <button id="zoom-in" title="拡大" aria-label="拡大">＋</button>
  <button id="zoom-fit" title="全体を表示" aria-label="全体を表示"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 1.5H1.5V6M10 1.5h4.5V6M14.5 10v4.5H10M1.5 10v4.5H6"/></svg></button>
  <button id="pc-size" title="PCサイズに固定" aria-label="PCサイズに固定" hidden>PC</button>
  <button id="pip" title="最前面の小窓で表示 (Picture-in-Picture)" aria-label="最前面の小窓で表示" hidden>PiP</button>
  <button id="soft-keyboard" title="キーボード" aria-label="キーボード" hidden>⌨</button>
  <button id="handover" data-mode="takeover" disabled>操作を引き継ぐ</button>
  <button id="bar-fold" title="バーを畳む" aria-label="バーを畳む"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6l5 5 5-5"/></svg></button>
</div>
<button id="bar-handle" title="バーを表示" aria-label="バーを表示"><span id="handle-dot"></span><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10l5-5 5 5"/></svg></button>
<script type="module">
// iOS Safari reuses cached ES modules without revalidating; bump the ?v= whenever the rfb.js patch changes
import RFB from "/core/rfb.js?v=9";
import Keyboard from "/core/input/keyboard.js";
import { getKeysym } from "/core/input/util.js";

const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const label = document.getElementById("label");
const handover = document.getElementById("handover");
const pipButton = document.getElementById("pip");
const kbdButton = document.getElementById("soft-keyboard");
const kbdInput = document.getElementById("kbd-input");
const pcButton = document.getElementById("pc-size");
const foldButton = document.getElementById("bar-fold");
const barHandle = document.getElementById("bar-handle");
const MAX_ZOOM = 5;

let inputTouch = matchMedia("(pointer: coarse)").matches;

function setInputTouch(t) {
  if (t !== inputTouch) {
    inputTouch = t;
    document.documentElement.classList.toggle("touch-ui", t);
    updatePhoneMode();
  }
  render();
}

document.addEventListener("pointerdown", ev => {
  if (ev.pointerType === "touch") setInputTouch(true);
  else if (ev.pointerType) setInputTouch(false);
}, true);
document.addEventListener("touchstart", () => setInputTouch(true),
  { capture: true, passive: true });

let emuWant = null;
function reportMode() {
  const want = phoneMode && !forcePc && manual && online ? "touch" : "cursor";
  if (want === emuWant) return;
  emuWant = want;
  fetch("/bb-mode", { method: "POST", body: want, keepalive: true })
    .catch(() => { emuWant = null; });
}
addEventListener("pagehide", () => {
  if (emuWant === "touch")
    fetch("/bb-mode", { method: "POST", body: "cursor", keepalive: true }).catch(() => {});
});

let rfb = null;
let canvas = null;
let manual = false;
let online = false;
let retryTimer = 0;
let idleTimer = 0;

function render() {
  bar.dataset.state = !online ? "offline" : manual ? "manual" : "readonly";
  label.textContent = !online ? "切断 — 再接続中…"
    : manual ? "手動操作中 — 入力が有効"
    : "表示のみ — agent が操作中";
  barHandle.dataset.state = bar.dataset.state;
  handover.disabled = !online;
  pipButton.disabled = !online && !pipActive();
  handover.dataset.mode = manual ? "return" : "takeover";
  handover.textContent = manual
    ? (inputTouch ? "戻す" : "agent に戻す")
    : (inputTouch ? "引き継ぐ" : "操作を引き継ぐ");
  kbdButton.hidden = !(manual && online) || !inputTouch;
  if (!manual || !online) kbdInput.blur();
  pcButton.hidden = !(phoneMode || forcePc);
  if (forcePc) pcButton.dataset.on = "true"; else delete pcButton.dataset.on;
  syncPad();
  reportMode();
}

function scale() { return rfb._display.scale; }

function fitScale() {
  const cont = canvas.parentElement;
  return Math.min(cont.clientWidth / canvas.width, cont.clientHeight / canvas.height);
}

function zoomTo(z, ax, ay) {
  if (!canvas) return;
  z = Math.min(z, MAX_ZOOM);
  if (z <= fitScale() * 1.02) rfb.scaleViewport = true;
  else {
    const cont = canvas.parentElement;
    const old = scale();
    const r0 = canvas.getBoundingClientRect();
    const fx = (ax - r0.left) / old;
    const fy = (ay - r0.top) / old;
    if (rfb.scaleViewport) rfb.scaleViewport = false;
    rfb._display.scale = z;
    const r1 = canvas.getBoundingClientRect();
    cont.scrollLeft += r1.left - (ax - fx * z);
    cont.scrollTop += r1.top - (ay - fy * z);
  }
  syncCanvasAnchor();
  if (padX !== null) padMoveTo(padX, padY);
}

function zoomStep(factor) {
  if (!canvas) return;
  zoomMode = "manual";
  const r = canvas.parentElement.getBoundingClientRect();
  zoomTo(scale() * factor, r.left + r.width / 2, r.top + r.height / 2);
}

document.getElementById("zoom-in").addEventListener("click", () => zoomStep(1.35));
document.getElementById("zoom-out").addEventListener("click", () => zoomStep(1 / 1.35));
document.getElementById("zoom-fit").addEventListener("click", () => {
  zoomMode = "fit";
  if (rfb) rfb.scaleViewport = true;
  syncCanvasAnchor();
});

const MIN_FB_WIDTH = 508;
window.BB_MIN_FB_WIDTH = MIN_FB_WIDTH;
let zoomMode = "fit";
let fitTimer = 0;

function applyFitLater(ms) {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => {
    if (rfb && zoomMode === "fit") rfb.scaleViewport = true;
    syncCanvasAnchor();
  }, ms);
}

/* noVNC centres the canvas (margin: auto); while fitting, pin it to the top so the tab strip is not pushed down the phone screen */
function syncCanvasAnchor() {
  if (!canvas || !rfb) return;
  const want = rfb.scaleViewport ? "0px" : "auto";
  if (canvas.style.marginTop !== want) canvas.style.marginTop = want;
}

/* #screen must match the visible viewport: the layout viewport can extend under the browser chrome */
function syncScreenHeight() {
  const vv = window.visualViewport;
  if (!vv || !vv.height) return;
  const h = Math.round(vv.height) + "px";
  if (screen.style.height !== h) screen.style.height = h;
}

let sizeDebounce = 0;
function onViewportResize() {
  syncScreenHeight();
  updatePhoneMode();
  clearTimeout(sizeDebounce);
  sizeDebounce = setTimeout(ensureRemoteSize, 400);
  if (zoomMode === "fit" && rfb) rfb.scaleViewport = true;
}
addEventListener("resize", onViewportResize);
if (window.visualViewport)
  visualViewport.addEventListener("resize", onViewportResize);

// iOS grants PiP only synchronously inside the tap with the video already playing; the stream is warmed up on connect
const pipVideo = document.createElement("video");
pipVideo.muted = true;
pipVideo.playsInline = true;
pipVideo.style.cssText =
  "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
document.body.appendChild(pipVideo);

function pipAttach() {
  pipDetach();
  pipVideo.srcObject = canvas.captureStream(30);
  pipVideo.play().catch(() => {});
}

function pipDetach() {
  const stream = pipVideo.srcObject;
  if (!stream) return;
  for (const t of stream.getTracks()) t.stop();
  pipVideo.srcObject = null;
}

function pipActive() {
  return document.pictureInPictureElement === pipVideo
    || pipVideo.webkitPresentationMode === "picture-in-picture";
}

// pictureInPictureEnabled reports true even in Home Screen web apps, which reject PiP (WebKit bug 303885); judge by the standalone context
function pipDetect() {
  const standalone = navigator.standalone
    || matchMedia("(display-mode: standalone)").matches;
  pipButton.hidden = !document.pictureInPictureEnabled
    || (standalone && typeof pipVideo.webkitSupportsPresentationMode === "function");
}
pipDetect();
pipButton.addEventListener("click", () => {
  if (pipActive()) {
    if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
    else pipVideo.webkitSetPresentationMode("inline");
    return;
  }
  if (pipVideo.requestPictureInPicture) pipVideo.requestPictureInPicture().catch(() => {});
  else pipVideo.webkitSetPresentationMode("picture-in-picture");
});
function pipSync() {
  if (pipActive()) pipButton.dataset.on = "true";
  else delete pipButton.dataset.on;
  // iOS pauses the video when its PiP closes; resume so the next tap works
  if (!pipActive() && online && pipVideo.paused) pipVideo.play().catch(() => {});
}
for (const ev of ["enterpictureinpicture", "leavepictureinpicture",
  "webkitpresentationmodechanged"])
  pipVideo.addEventListener(ev, pipSync);

let pinchStart = null;
let panLast = null;

function onGesture(ev) {
  const t = ev.detail.type;
  if (t !== "pinch" && t !== "twodrag") return;
  ev.stopImmediatePropagation();
  if (t === "pinch") {
    const dist = Math.hypot(ev.detail.magnitudeX, ev.detail.magnitudeY);
    if (ev.type === "gesturestart") {
      zoomMode = "manual";
      pinchStart = { dist: dist || 1, scale: scale() };
    } else if (ev.type === "gesturemove" && pinchStart) {
      zoomTo(pinchStart.scale * dist / pinchStart.dist, ev.detail.clientX, ev.detail.clientY);
    }
  } else if (ev.type === "gesturemove") {
    const cont = canvas.parentElement;
    if (panLast) {
      cont.scrollLeft -= ev.detail.magnitudeX - panLast.x;
      cont.scrollTop -= ev.detail.magnitudeY - panLast.y;
    }
    panLast = { x: ev.detail.magnitudeX, y: ev.detail.magnitudeY };
  }
  if (ev.type === "gestureend") { pinchStart = null; panLast = null; }
}

function hookCanvas() {
  canvas = screen.querySelector("canvas");
  for (const type of ["gesturestart", "gesturemove", "gestureend"]) {
    canvas.addEventListener(type, onGesture, true);
  }
  new MutationObserver(() => applyFitLater(150))
    .observe(canvas, { attributes: true, attributeFilter: ["width", "height"] });
}

const TAP_MS = 400;
const TAP_SLOP = 10;
const RETAP_MS = 400;
const DECIDE_SLOP = 15;
const WHEEL_STEP = 50;
const EDGE_MARGIN = 48;

let padX = null, padY = null;
let padTapEnd = 0;
let padDrag = false;
let t1 = null, t2 = null;
let twoMode = null;

function padMoveTo(x, y, keepVisible) {
  padX = Math.min(Math.max(x, 0), canvas.width - 1);
  padY = Math.min(Math.max(y, 0), canvas.height - 1);
  if (keepVisible) padKeepVisible();
  const r = canvas.getBoundingClientRect();
  rfb._fakeMouseMove({ detail: {
    clientX: r.left + padX * scale(), clientY: r.top + padY * scale(),
  } }, padX * scale(), padY * scale());
}

function padKeepVisible() {
  const cont = canvas.parentElement;
  const cr = cont.getBoundingClientRect();
  const r = canvas.getBoundingClientRect();
  const cx = r.left + padX * scale();
  const cy = r.top + padY * scale();
  const beyond = (v, lo, hi) =>
    v > hi - EDGE_MARGIN ? v - (hi - EDGE_MARGIN)
      : v < lo + EDGE_MARGIN ? v - (lo + EDGE_MARGIN) : 0;
  cont.scrollLeft += beyond(cx, cr.left, cr.right);
  cont.scrollTop += beyond(cy, cr.top, cr.bottom);
}

function padBy(dx, dy) { padMoveTo(padX + dx / scale(), padY + dy / scale(), manual); }

function padClick(mask) { rfb._handleMouseButton(padX * scale(), padY * scale(), mask); }

function padReset() {
  if (padDrag) padClick(0);
  padDrag = false;
  t1 = t2 = twoMode = null;
}

function directTouch() { return phoneMode && !forcePc; }

function syncPad() {
  // noVNC's touch fallback cursor starts hidden and only mouse input would ever show it
  if (rfb && rfb._cursor) rfb._cursor._canvas.style.visibility = "";
  if (!inputTouch || !online) { padReset(); padX = null; return; }
  if (directTouch()) {
    padReset(); padX = null;
    return;
  }
  if (!manual) { padReset(); padX = null; return; }
  if (padX === null && canvas) {
    const r = canvas.getBoundingClientRect();
    padX = Math.min(Math.max((innerWidth / 2 - r.left) / scale(), 0), canvas.width - 1);
    padY = Math.min(Math.max((innerHeight / 2 - r.top) / scale(), 0), canvas.height - 1);
    padMoveTo(padX, padY);
  }
}

function padStart(id, x, y) {
  const now = Date.now();
  if (!t1) {
    t1 = { id, x0: x, y0: y, x, y, start: now, retap: now - padTapEnd < RETAP_MS };
  } else if (!t2 && !twoMode && !padDrag) {
    t2 = { id, x0: x, y0: y, x, y };
    twoMode = { type: "undecided", z: scale(), cx: (t1.x + x) / 2, cy: (t1.y + y) / 2 };
  }
}

function padMove(id, x, y) {
  const t = t1 && t1.id === id ? t1 : t2 && t2.id === id ? t2 : null;
  if (!t) return;
  const px = t.x, py = t.y;
  t.x = x; t.y = y;
  if (twoMode) { padTwoMove(); return; }
  if (Math.hypot(x - t.x0, y - t.y0) <= TAP_SLOP) return;
  if (!manual) {
    const cont = canvas.parentElement;
    cont.scrollLeft -= x - px;
    cont.scrollTop -= y - py;
    return;
  }
  if (padDrag) { padBy(x - px, y - py); return; }
  if (t.retap) { padDrag = true; padClick(0x1); }
  padBy(x - px, y - py);
}

function padTwoMove() {
  const d1x = t1.x - t1.x0, d1y = t1.y - t1.y0;
  const d2x = t2.x - t2.x0, d2y = t2.y - t2.y0;
  if (twoMode.type === "undecided") {
    if (Math.max(Math.hypot(d1x, d1y), Math.hypot(d2x, d2y)) < DECIDE_SLOP) return;
    twoMode.type = d1x * d2x + d1y * d2y < 0 ? "pinch" : "scroll";
    if (twoMode.type === "pinch") zoomMode = "manual";
    twoMode.dist = Math.hypot(t1.x - t2.x, t1.y - t2.y);
    twoMode.ax = (d1x + d2x) / 2;
    twoMode.ay = (d1y + d2y) / 2;
  }
  if (twoMode.type === "pinch") {
    const dist = Math.hypot(t1.x - t2.x, t1.y - t2.y);
    if (dist > 0) zoomTo(twoMode.z * dist / twoMode.dist, twoMode.cx, twoMode.cy);
  } else {
    const ax = (d1x + d2x) / 2, ay = (d1y + d2y) / 2;
    if (manual) {
      while (ay - twoMode.ay >= WHEEL_STEP) { padClick(0x10); padClick(0); twoMode.ay += WHEEL_STEP; }
      while (twoMode.ay - ay >= WHEEL_STEP) { padClick(0x8); padClick(0); twoMode.ay -= WHEEL_STEP; }
      while (ax - twoMode.ax >= WHEEL_STEP) { padClick(0x40); padClick(0); twoMode.ax += WHEEL_STEP; }
      while (twoMode.ax - ax >= WHEEL_STEP) { padClick(0x20); padClick(0); twoMode.ax -= WHEEL_STEP; }
    } else {
      const cont = canvas.parentElement;
      cont.scrollLeft -= ax - twoMode.ax;
      cont.scrollTop -= ay - twoMode.ay;
      twoMode.ax = ax;
      twoMode.ay = ay;
    }
  }
}

function padEnd(id, x, y) {
  if (twoMode) {
    if (t1.id === id || t2.id === id) {
      const tap = twoMode.type === "undecided"
        && Date.now() - t1.start < TAP_MS
        && Math.hypot(x - t1.x0, y - t1.y0) <= TAP_SLOP
        && Math.hypot(t2.x - t2.x0, t2.y - t2.y0) <= TAP_SLOP;
      if (tap && manual) { padClick(0x4); padClick(0); }
      padReset();
    }
    return;
  }
  if (!t1 || t1.id !== id) return;
  if (padDrag) padClick(0);
  else if (manual && Date.now() - t1.start < TAP_MS
        && Math.hypot(x - t1.x0, y - t1.y0) <= TAP_SLOP) {
    padClick(0x1); padClick(0);
    padTapEnd = Date.now();
  } else {
    padTapEnd = 0;
  }
  padDrag = false;
  t1 = null;
}

function onPadTouch(ev) {
  if (!inputTouch || !online || directTouch()) return;
  ev.preventDefault();
  ev.stopImmediatePropagation();
  poke();
  if (ev.type === "touchcancel") { padReset(); return; }
  const fn = ev.type === "touchstart" ? padStart
    : ev.type === "touchmove" ? padMove : padEnd;
  for (const t of ev.changedTouches) fn(t.identifier, t.clientX, t.clientY);
}

for (const type of ["touchstart", "touchmove", "touchend", "touchcancel"]) {
  screen.addEventListener(type, onPadTouch, true);
}

const PHONE_MAX_WIDTH = 860;
const PH_TAP_MS = 350;
const PH_SLOP = 12;
const PH_LONG_MS = 450;

let phoneMode = false;
let ph1 = null, ph2 = null, phTwo = null;
let phDragBtn = false;

function updatePhoneMode() {
  const next = inputTouch && innerWidth <= PHONE_MAX_WIDTH;
  if (next === phoneMode) return;
  phoneMode = next;
  padReset(); padX = null;
  phoneReset();
  render();
}

function zoomedIn() {
  return zoomMode === "manual" && canvas && scale() > fitScale() * 1.02;
}

function toElement(x, y) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.min(Math.max(x - r.left, 0), r.width - 1),
    y: Math.min(Math.max(y - r.top, 0), r.height - 1),
  };
}

function phoneMoveTo(x, y) {
  if (!canvas || !rfb) return;
  const p = toElement(x, y);
  rfb._fakeMouseMove({ detail: { clientX: x, clientY: y } }, p.x, p.y);
}

function phoneButton(x, y, mask) {
  if (!canvas || !rfb) return;
  const p = toElement(x, y);
  rfb._handleMouseButton(p.x, p.y, mask);
}

function phoneWheel(x, y, mask) {
  phoneMoveTo(x, y);
  phoneButton(x, y, mask);
  phoneButton(x, y, 0);
}

function phoneReset() {
  if (ph1 && ph1.longTimer) clearTimeout(ph1.longTimer);
  if (phDragBtn && rfb) phoneButton(ph1 ? ph1.x : 0, ph1 ? ph1.y : 0, 0);
  phDragBtn = false;
  ph1 = ph2 = phTwo = null;
}

function phoneStart(id, x, y) {
  if (!ph1) {
    ph1 = { id, x0: x, y0: y, x, y, start: Date.now(), mode: "undecided", longTimer: 0 };
    if (!manual) return;
    phoneMoveTo(x, y);
    ph1.longTimer = setTimeout(() => {
      if (!ph1 || ph1.mode !== "undecided") return;
      ph1.mode = "drag";
      phoneButton(ph1.x0, ph1.y0, 0x1);
      phDragBtn = true;
    }, PH_LONG_MS);
  } else if (!ph2 && !phTwo) {
    if (ph1.longTimer) { clearTimeout(ph1.longTimer); ph1.longTimer = 0; }
    if (phDragBtn) { phoneButton(ph1.x, ph1.y, 0); phDragBtn = false; }
    ph1.mode = "two";
    ph2 = { id, x0: x, y0: y, x, y };
    phTwo = { type: "undecided", z: scale(), dist: 1,
      dist0: Math.hypot(ph1.x - x, ph1.y - y) || 1, cx: 0, cy: 0, ax: 0, ay: 0 };
  }
}

function phoneMove(id, x, y) {
  const t = ph1 && ph1.id === id ? ph1 : ph2 && ph2.id === id ? ph2 : null;
  if (!t) return;
  const dx = x - t.x, dy = y - t.y;
  t.x = x; t.y = y;
  if (phTwo) { phoneTwoMove(); return; }
  if (!ph1 || ph1.id !== id) return;
  if (ph1.mode === "drag") { phoneMoveTo(x, y); return; }
  if (ph1.mode === "pan") {
    const cont = canvas.parentElement;
    cont.scrollLeft -= dx;
    cont.scrollTop -= dy;
    return;
  }
  if (Math.hypot(x - ph1.x0, y - ph1.y0) <= PH_SLOP) return;
  if (ph1.longTimer) { clearTimeout(ph1.longTimer); ph1.longTimer = 0; }
  if (!manual || zoomedIn()) {
    ph1.mode = "pan";
    const cont = canvas.parentElement;
    cont.scrollLeft -= dx;
    cont.scrollTop -= dy;
  } else {
    ph1.mode = "drag";
    phoneMoveTo(ph1.x0, ph1.y0);
    phoneButton(ph1.x0, ph1.y0, 0x1);
    phDragBtn = true;
    phoneMoveTo(x, y);
  }
}

function phoneTwoMove() {
  const d1x = ph1.x - ph1.x0, d1y = ph1.y - ph1.y0;
  const d2x = ph2.x - ph2.x0, d2y = ph2.y - ph2.y0;
  if (phTwo.type === "undecided") {
    if (Math.max(Math.hypot(d1x, d1y), Math.hypot(d2x, d2y)) < DECIDE_SLOP) return;
    // the dot product alone misreads a pinch when only one finger has reported movement so far
    const distNow = Math.hypot(ph1.x - ph2.x, ph1.y - ph2.y);
    phTwo.type = Math.abs(distNow - phTwo.dist0) > 10
      || d1x * d2x + d1y * d2y < 0 ? "pinch" : "scroll";
    if (phTwo.type === "pinch") zoomMode = "manual";
    phTwo.dist = distNow || 1;
    phTwo.cx = (ph1.x + ph2.x) / 2;
    phTwo.cy = (ph1.y + ph2.y) / 2;
    phTwo.ax = (d1x + d2x) / 2;
    phTwo.ay = (d1y + d2y) / 2;
  }
  if (phTwo.type === "pinch") {
    const dist = Math.hypot(ph1.x - ph2.x, ph1.y - ph2.y);
    if (dist > 0) zoomTo(phTwo.z * dist / phTwo.dist, phTwo.cx, phTwo.cy);
  } else {
    const ax = (d1x + d2x) / 2, ay = (d1y + d2y) / 2;
    if (manual) {
      const mx = (ph1.x + ph2.x) / 2, my = (ph1.y + ph2.y) / 2;
      while (ay - phTwo.ay >= WHEEL_STEP) { phoneWheel(mx, my, 0x10); phTwo.ay += WHEEL_STEP; }
      while (phTwo.ay - ay >= WHEEL_STEP) { phoneWheel(mx, my, 0x8); phTwo.ay -= WHEEL_STEP; }
      while (ax - phTwo.ax >= WHEEL_STEP) { phoneWheel(mx, my, 0x40); phTwo.ax += WHEEL_STEP; }
      while (phTwo.ax - ax >= WHEEL_STEP) { phoneWheel(mx, my, 0x20); phTwo.ax -= WHEEL_STEP; }
    } else {
      const cont = canvas.parentElement;
      cont.scrollLeft -= ax - phTwo.ax;
      cont.scrollTop -= ay - phTwo.ay;
      phTwo.ax = ax;
      phTwo.ay = ay;
    }
  }
}

function phoneEnd(id, x, y) {
  if (phTwo) {
    if ((ph1 && ph1.id === id) || (ph2 && ph2.id === id)) {
      const tap = phTwo.type === "undecided"
        && Date.now() - ph1.start < PH_TAP_MS + 150
        && Math.hypot(ph1.x - ph1.x0, ph1.y - ph1.y0) <= PH_SLOP
        && Math.hypot(ph2.x - ph2.x0, ph2.y - ph2.y0) <= PH_SLOP;
      if (tap && manual) {
        const mx = (ph1.x0 + ph2.x0) / 2, my = (ph1.y0 + ph2.y0) / 2;
        phoneMoveTo(mx, my);
        phoneButton(mx, my, 0x4);
        phoneButton(mx, my, 0);
      }
      phoneReset();
    }
    return;
  }
  if (!ph1 || ph1.id !== id) return;
  if (ph1.longTimer) clearTimeout(ph1.longTimer);
  if (phDragBtn) {
    phoneButton(x, y, 0);
    phDragBtn = false;
  } else if (manual && ph1.mode === "undecided"
      && Date.now() - ph1.start < PH_TAP_MS
      && Math.hypot(x - ph1.x0, y - ph1.y0) <= PH_SLOP) {
    phoneMoveTo(x, y);
    phoneButton(x, y, 0x1);
    phoneButton(x, y, 0);
  }
  ph1 = null;
}

function onPhoneTouch(ev) {
  if (!directTouch() || !online) return;
  ev.preventDefault();
  ev.stopImmediatePropagation();
  poke();
  if (ev.type === "touchcancel") { phoneReset(); return; }
  const fn = ev.type === "touchstart" ? phoneStart
    : ev.type === "touchmove" ? phoneMove : phoneEnd;
  for (const t of ev.changedTouches) fn(t.identifier, t.clientX, t.clientY);
}

for (const type of ["touchstart", "touchmove", "touchend", "touchcancel"]) {
  screen.addEventListener(type, onPhoneTouch, true);
}

const PC_SIZE = { w: 1920, h: 1080 };
// the pin survives reloads: iOS discards heavy pages in the background and reloads them
let forcePc = false;
try { forcePc = localStorage.getItem("bb-force-pc") === "1"; } catch {}
if (forcePc) window.BB_FORCE_SIZE = PC_SIZE;

function desiredFbSize() {
  if (forcePc) return PC_SIZE;
  const r = screen.getBoundingClientRect();
  return { w: Math.max(Math.floor(r.width), MIN_FB_WIDTH), h: Math.floor(r.height) };
}

function fbMatches() {
  if (!canvas) return true;
  const want = desiredFbSize();
  return canvas.width === want.w && canvas.height === want.h;
}

function ensureRemoteSize() {
  if (!rfb || !canvas || fbMatches()) return;
  rfb._requestRemoteResize();
}
let sizeTimer = 0;
function ensureRemoteSizeSoon() {
  clearInterval(sizeTimer);
  let n = 0;
  sizeTimer = setInterval(() => {
    ensureRemoteSize();
    if (fbMatches() || ++n >= 12) clearInterval(sizeTimer);
  }, 500);
}

// iOS freezes page timers in background tabs, and a lost resize reply wedges the size until something asks again
setInterval(() => { ensureRemoteSize(); syncCanvasAnchor(); }, 800);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { syncScreenHeight(); ensureRemoteSizeSoon(); }
});

/* Xvnc sends the cursor shape only after pointer motion in this session; wiggle it 1px through our own input path */
async function primeCursor() {
  if (!rfb || manual) return;
  try {
    const res = await fetch("/bb-pointer");
    if (!res.ok) return;
    const { x, y } = await res.json();
    if (!canvas) return;
    const dx = x + 1 < canvas.width ? 1 : -1;
    const move = (px, py) => {
      const r = canvas.getBoundingClientRect();
      rfb._fakeMouseMove({ detail: {
        clientX: r.left + px * scale(), clientY: r.top + py * scale(),
      } }, px * scale(), py * scale());
    };
    rfb.viewOnly = false;
    move(x + dx, y);
    setTimeout(() => {
      if (!rfb) return;
      move(x, y);
      rfb.viewOnly = !manual;
    }, 90);
  } catch {}
}

function setForcePc(on) {
  forcePc = on;
  try { localStorage.setItem("bb-force-pc", on ? "1" : "0"); } catch {}
  phoneReset();
  padReset();
  if (rfb) {
    if (on) {
      window.BB_FORCE_SIZE = PC_SIZE;
      zoomMode = "fit";
      rfb.scaleViewport = true;
    } else {
      delete window.BB_FORCE_SIZE;
      zoomMode = "fit";
      rfb.scaleViewport = true;
    }
    ensureRemoteSize();
    ensureRemoteSizeSoon();
  }
  render();
}

// a tap arrives as pointerup then click; the click can be eaten or delayed past a dedupe window and
// then toggle a second time, so the pointerup toggles and a click counts only when it is not a tap's tail
let pcTapAt = 0;
pcButton.addEventListener("pointerup", ev => {
  if (ev.pointerType === "mouse") return;
  const r = pcButton.getBoundingClientRect();
  if (ev.clientX < r.left || ev.clientX > r.right
      || ev.clientY < r.top || ev.clientY > r.bottom) return;
  pcTapAt = Date.now();
  setForcePc(!forcePc);
});
pcButton.addEventListener("click", () => {
  if (Date.now() - pcTapAt < 1500) return;
  setForcePc(!forcePc);
});

const kbd = new Keyboard(kbdInput);
kbd.onkeyevent = (keysym, code, down) => {
  if (manual && online && rfb) rfb.sendKey(keysym, code, down);
};
let kbdGrabbed = false;
function kbdGrab(on) {
  if (on === kbdGrabbed) return;
  kbdGrabbed = on;
  on ? kbd.grab() : kbd.ungrab();
  kbdButton.dataset.on = on;
}
kbdInput.addEventListener("focus", () => kbdGrab(true));
kbdInput.addEventListener("blur", () => kbdGrab(false));
kbdButton.addEventListener("click", () =>
  document.activeElement === kbdInput ? kbdInput.blur() : kbdInput.focus());

function sendText(text) {
  for (const ch of text) {
    if (ch === "\n" || ch === "\r") { rfb.sendKey(0xff0d, "Enter"); continue; }
    if (ch === "\t") { rfb.sendKey(0xff80, "Tab"); continue; }
    const keysym = getKeysym({ key: ch });
    if (keysym) rfb.sendKey(keysym, null);
  }
}
kbdInput.addEventListener("compositionend", ev => {
  if (manual && online && rfb && ev.data) sendText(ev.data);
  kbdInput.value = "";
});
kbdInput.addEventListener("paste", ev => {
  const text = ev.clipboardData.getData("text/plain");
  if (!manual || !online || !text) return;
  ev.preventDefault();
  sendText(text);
  kbdInput.value = "";
});

let barFolded = false;
function setBarFolded(f) {
  barFolded = f;
  bar.classList.toggle("folded", f);
  barHandle.classList.toggle("shown", f);
}
foldButton.addEventListener("click", () => setBarFolded(true));
barHandle.addEventListener("click", () => setBarFolded(false));

handover.addEventListener("click", () => {
  manual = !manual;
  rfb.viewOnly = !manual;
  if (manual) rfb.focus({ preventScroll: true });
  render();
});

function poke() {
  bar.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => bar.classList.add("idle"), 3000);
}
poke();
for (const ev of ["mousemove", "keydown", "pointerdown"]) {
  document.addEventListener(ev, poke);
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  screen.replaceChildren();
  rfb = new RFB(screen, `${proto}://${location.host}/websockify`);
  rfb.viewOnly = !manual;
  rfb.scaleViewport = true;
  rfb.resizeSession = true;
  rfb.addEventListener("connect", () => {
    online = true;
    primeCursor();
    if (forcePc) window.BB_FORCE_SIZE = PC_SIZE;
    hookCanvas();
    syncScreenHeight();
    ensureRemoteSizeSoon();
    applyFitLater(900);
    if (canvas.captureStream) pipAttach();
    else pipButton.hidden = true;
    render();
  });
  rfb.addEventListener("disconnect", () => {
    online = false;
    canvas = null;
    if (!pipActive()) pipDetach();
    render();
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, 3000);
  });
}

syncScreenHeight();
updatePhoneMode();
connect();
render();
</script>
</body>
</html>
