services:
  box:
    build: .
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - profile:/data/profile
      - ./ui/index.html:/usr/share/novnc/index.html:ro
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9222/json/version >/dev/null && curl -sf http://127.0.0.1:6080/vnc.html >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 3m

volumes:
  profile:
