# Optional NVIDIA GPU rendering for the browser (WebGL/WebGPU/compositing).
#
# Requires nvidia-container-toolkit on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/toolkit/latest/installation-guide.html
#
# Start with:
#   docker compose -f compose.yml -f compose.gpu.yml up -d --build
#
# The entrypoint auto-detects the GPU (set GPU=0 to force software rendering).
# The graphics capability injects NVIDIA's EGL/Vulkan user-space libraries;
# libvulkan1 ships in the image as the loader. examples/gpu-check.mjs reports the
# resulting WebGL renderer; the box log shows the detected GPU.
services:
  box:
    environment:
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
